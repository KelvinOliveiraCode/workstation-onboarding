[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workstation-onboarding"
version = "1.0.0"
description = "Scripts PowerShell para preparacao de estacoes Windows: rede, impressoras, software, politicas e verificacao final"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["workstation", "onboarding", "powershell", "provisionamento"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]
# A dependencia de execucao e apenas o PyYAML, usado pelos testes e pela
# CLI para validar os arquivos de configuracao. Os scripts PowerShell
# nao dependem de nenhum pacote Python.
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
workstation = "workstation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["workstation"]

[tool.coverage.report]
show_missing = true
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise SystemExit",
    "if TYPE_CHECKING:",
]
