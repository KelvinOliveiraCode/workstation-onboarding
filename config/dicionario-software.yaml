# Dicionario de software - workstation-onboarding
# Catalogo FICTICIO de pacotes internos. Nenhum nome real de programa,
# driver ou fabricante. Os caminhos de origem apontam para a pasta de
# rede ficticia \\srv-software, que nao existe fora deste repositorio.
#
# Esquema (lido por scripts\Instalar-Software.ps1 e pelos testes Python):
#   pacotes:
#     - id: kebab-case        (obrigatorio, unico)
#       nome: descricao curta (obrigatorio)
#       versao: numerica      (obrigatorio, string)
#       categoria: grupo     (obrigatorio)
#       silencioso: true/false (obrigatorio, booleano)
#       origem: caminho de rede (obrigatorio, \\srv-...)

versao_catalogo: '2026.10'

pacotes:
